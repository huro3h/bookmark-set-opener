<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Bookmark Set Opener の設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main id="main">
      <h1>Bookmark Set Opener</h1>

      <section>
        <h2>セット</h2>
        <p class="note">
          別々のフォルダにあるブックマークを1つにまとめて、ポップアップから1クリックで開けるようにします。
          ブックマークのタイトルや URL を後で直すと、セットにもそのまま反映されます。
        </p>
        <ul id="sets" class="sets"></ul>
        <div class="actions">
          <button type="button" id="newSet" class="button primary">新しいセット</button>
          <span class="spacer"></span>
          <button type="button" id="export" class="button">エクスポート</button>
          <button type="button" id="import" class="button">インポート</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden />
        </div>
        <p id="message" class="message"></p>
      </section>

      <section>
        <h2>ショートカットキー</h2>
        <p class="note">
          スロットにセットかフォルダを割り当て、そのスロットにキーを設定すると、ポップアップを開かずにまとめて開けます。
          キーは初期状態では割り当てていません。
        </p>
        <table class="slots">
          <tbody id="slots"></tbody>
        </table>
        <button type="button" id="shortcuts" class="button">ショートカットキーを設定する</button>
      </section>
    </main>

    <main id="editor" class="hidden">
      <div class="editor-head">
        <h1 id="editorTitle"></h1>
        <label class="name-field">
          <span class="field-label">名前</span>
          <input type="text" id="setName" class="input" placeholder="例: 朝のチェック" autocomplete="off" />
        </label>
        <div class="editor-actions">
          <button type="button" id="undo" class="icon-btn history" title="元に戻す (⌘Z / Ctrl+Z)" aria-label="元に戻す">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
          </button>
          <button type="button" id="redo" class="icon-btn history" title="やり直す (⇧⌘Z / Ctrl+Y)" aria-label="やり直す">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
          </button>
          <button type="button" id="cancel" class="button">キャンセル</button>
          <button type="button" id="save" class="button primary">保存</button>
        </div>
      </div>

      <div id="picker" class="picker"></div>

      <section id="selectedSection" class="selected-section">
        <h2 id="selectedHeading"></h2>
        <ul id="selectedList" class="selected-list"></ul>
        <p id="selectedEmpty" class="note hidden">まだ何も選択していません</p>
      </section>

      <div id="menus"></div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <span id="toastMessage"></span>
      <button type="button" id="toastAction" class="toast-action" hidden></button>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
